<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodo Tecno · Tecnología y electrodomésticos</title>
<meta name="description" content="Periféricos, teléfonos, electrodomésticos, PCs y componentes. Armá tu pedido online.">
<meta name="theme-color" content="#0E1A2B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230E1A2B'/%3E%3Ccircle cx='22' cy='22' r='6' fill='%23FFD21F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div class="demo-bar" id="demoBar" hidden>Vista previa con datos de ejemplo guardados solo en este navegador. Pegá tu configuración de Firebase en <b>firebase-config.js</b> para publicar la tienda.</div>
<div class="perks" id="perks"><div class="wrap"></div></div>

<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#/" aria-label="Ir al inicio"><span class="logo-mark" aria-hidden="true"></span><span class="js-name">Nodo Tecno</span></a>
    <form class="search" id="searchForm" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q">Buscar productos</label>
      <input id="q" type="search" placeholder="Buscar productos" autocomplete="off" enterkeyhint="search">
    </form>
    <button type="button" class="cart-btn" id="cartBtn" aria-label="Abrir carrito">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="n" id="cartN">0</span><span class="t" id="cartT">$ 0</span>
    </button>
  </div>
</header>
<nav class="catnav" id="catNav" aria-label="Secciones"><div class="wrap"><ul></ul></div></nav>

<main id="app"></main>

<footer class="foot">
  <div class="wrap foot-in">
    <div><span class="logo"><span class="logo-mark" aria-hidden="true"></span><span class="js-name">Nodo Tecno</span></span><p id="footTag"></p></div>
    <div><h4>Secciones</h4><ul id="footCats"></ul></div>
    <div id="footLocal"><h4>El local</h4><p id="footInfo" style="margin-top:0"></p></div>
  </div>
  <div class="wrap foot-b"><span>© <span class="js-name">Nodo Tecno</span></span><a href="#/admin">Acceso administradores</a></div>
</footer>

<dialog id="dlgProduct" aria-label="Detalle del producto"></dialog>
<dialog id="dlgCart" class="drawer" aria-label="Carrito de compras"></dialog>
<dialog id="dlgForm" aria-label="Formulario"></dialog>
<dialog id="dlgConfirm" aria-label="Confirmar">
  <div class="dlg-in"><p id="confirmMsg" style="font-weight:600;margin-bottom:18px"></p>
  <div class="dlg-f"><button type="button" class="btn btn-line" id="confirmNo">Cancelar</button><button type="button" class="btn btn-danger" id="confirmOk">Eliminar</button></div></div>
</dialog>
<div id="toasts" popover="manual" aria-live="polite"></div>

<script src="firebase-config.js"></script>
<script type="module">
/*__JS__*/
</script>
</body>
</html>
