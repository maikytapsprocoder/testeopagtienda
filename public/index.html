<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodo Tecno · Tecnología y electrodomésticos</title>
<meta name="description" content="Periféricos, teléfonos, electrodomésticos, PCs y componentes. Armá tu pedido online.">
<meta name="theme-color" content="#0E1A2B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230E1A2B'/%3E%3Ccircle cx='22' cy='22' r='6' fill='%23FFD21F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0E1A2B; --ink-2: #4A5668; --ink-3: #7B8696;
  --paper: #F3F5F8; --surface: #FFFFFF; --line: #E1E6ED;
  --cobalt: #2347F5; --cobalt-d: #1A36C4; --tag: #FFD21F;
  --coral: #D83A41; --green: #0E8A4F;
  --r-s: 8px; --r-m: 14px; --r-l: 22px;
  --font-d: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-b: 'Figtree', system-ui, sans-serif;
  --shadow: 0 1px 2px rgba(14, 26, 43, .06), 0 8px 24px -12px rgba(14, 26, 43, .18);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--font-b); min-height: 100vh; display: flex; flex-direction: column; }
body:has(dialog[open]) { overflow: hidden; }
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.wrap { width: min(1240px, 100% - 32px); margin-inline: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
main { flex: 1; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid transparent; font-weight: 700; text-decoration: none; background: var(--surface); transition: background .15s, border-color .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--cobalt); color: #fff; }
.btn-primary:hover { background: var(--cobalt-d); }
.btn-ink { background: var(--ink); color: #fff; }
.btn-ink:hover { background: #1c2c45; }
.btn-line { border-color: var(--line); background: var(--surface); }
.btn-line:hover { border-color: var(--ink-3); }
.btn-tag { background: var(--tag); color: var(--ink); }
.btn-tag:hover { background: #ffdc4d; }
.btn-danger { color: var(--coral); border-color: #f2c4c6; background: #fff; }
.btn-danger:hover { background: #fdf0f0; }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.linkish { background: none; border: 0; padding: 0; text-align: inherit; font: inherit; color: inherit; cursor: pointer; }

/* Barra demo y beneficios */
.demo-bar { background: var(--tag); color: var(--ink); font-size: 14px; text-align: center; padding: 8px 16px; }
.perks { background: var(--ink); color: #dfe6f1; font-size: 13.5px; }
.perks .wrap { display: flex; justify-content: center; gap: 36px; padding: 8px 0; flex-wrap: wrap; }
.perks span::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--tag); margin-right: 9px; vertical-align: middle; }

/* Header */
.top { background: var(--surface); position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--line); }
.top-in { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; min-height: 70px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font: 800 25px/1 var(--font-d); letter-spacing: -.035em; text-decoration: none; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); position: relative; flex: none; }
.logo-mark::after { content: ''; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--tag); right: 5px; bottom: 5px; }
.search { position: relative; max-width: 560px; width: 100%; justify-self: center; }
.search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; height: 46px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); padding: 0 18px 0 44px; }
.search input:focus { outline: none; border-color: var(--cobalt); background: #fff; box-shadow: 0 0 0 4px rgba(35, 71, 245, .12); }
.cart-btn { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px 0 14px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font-weight: 700; }
.cart-btn .n { min-width: 22px; height: 22px; padding: 0 6px; display: grid; place-items: center; border-radius: 99px; background: var(--tag); color: var(--ink); font-size: 13px; font-weight: 800; }
.cart-btn.bump .n { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.35); } }

.catnav { background: var(--surface); border-bottom: 1px solid var(--line); }
.catnav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.catnav a { display: block; padding: 13px 14px; font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap; color: var(--ink-2); border-bottom: 3px solid transparent; }
.catnav a:hover { color: var(--ink); }
.catnav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--cobalt); }
.catnav a.hot { color: var(--coral); }

/* Hero */
.hero { margin-top: 24px; position: relative; border-radius: var(--r-l); overflow: hidden; display: grid; background: var(--ink); }
.slide { grid-area: 1 / 1; display: grid; grid-template-columns: 1.15fr 1fr; align-items: center; min-height: 380px; padding: 40px 56px; gap: 24px; opacity: 0; visibility: hidden; transition: opacity .5s, visibility .5s; background: var(--bg); color: var(--fg); }
.slide.on { opacity: 1; visibility: visible; }
.slide h2 { font: 800 clamp(30px, 4.4vw, 54px)/1.02 var(--font-d); letter-spacing: -.035em; max-width: 14ch; text-wrap: balance; }
.slide p { margin-top: 14px; font-size: 18px; max-width: 38ch; opacity: .9; }
.slide .btn { margin-top: 26px; }
.slide-art { position: relative; justify-self: center; width: min(100%, 360px); aspect-ratio: 1; display: grid; place-items: center; }
.slide-art::before { content: ''; position: absolute; inset: 6%; border-radius: 50%; background: rgba(255, 255, 255, .16); }
.slide-art img { position: relative; width: 88%; height: 88%; object-fit: contain; }
.slide-art img.photo { border-radius: var(--r-m); object-fit: cover; width: 100%; height: 100%; }
.dots { position: absolute; left: 56px; bottom: 22px; display: flex; gap: 8px; z-index: 2; }
.dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .45); transition: width .2s, background .2s; }
.dots button[aria-current="true"] { width: 28px; border-radius: 99px; background: #fff; }
.dots.dark button { background: rgba(14, 26, 43, .3); }
.dots.dark button[aria-current="true"] { background: var(--ink); }

/* Secciones */
.sec { margin-top: 48px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.sec-h h2 { font: 800 clamp(24px, 3vw, 32px)/1.1 var(--font-d); letter-spacing: -.03em; }
.sec-h a { font-weight: 700; color: var(--cobalt); text-decoration: none; }
.sec-h a:hover { text-decoration: underline; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.tile { position: relative; display: block; border-radius: var(--r-m); background: var(--tint); padding: 20px 20px 0; text-decoration: none; overflow: hidden; min-height: 220px; transition: transform .2s; }
.tile:hover { transform: translateY(-3px); }
.tile h3 { font: 700 20px/1.15 var(--font-d); letter-spacing: -.02em; }
.tile p { margin-top: 6px; font-size: 14px; color: var(--ink-2); max-width: 52%; }
.tile img { position: absolute; right: -4px; bottom: -4px; width: 52%; }

/* Productos */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 16px; }
.card { background: var(--surface); border-radius: var(--r-m); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); }
.card-img { position: relative; display: block; width: 100%; aspect-ratio: 1 / .86; border: 0; padding: 18px; background: var(--tint, #eef1f6); }
.card-img img { width: 100%; height: 100%; object-fit: contain; transition: transform .25s; }
.card:hover .card-img img { transform: scale(1.04); }
.card-img img.photo { mix-blend-mode: normal; }
.tag { position: absolute; left: 0; top: 14px; background: radial-gradient(circle at 9px 50%, var(--tint, #eef1f6) 0 2.5px, transparent 3px), var(--tag); color: var(--ink); font: 800 14px/1 var(--font-d); padding: 7px 12px 7px 20px; clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); padding-right: 18px; }
.out { position: absolute; inset: auto 0 0 0; text-align: center; background: rgba(14, 26, 43, .78); color: #fff; font-weight: 700; font-size: 14px; padding: 6px; }
.card.is-out .card-img img { opacity: .45; filter: grayscale(.6); }
.card-b { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; flex: 1; }
.card-meta { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.card-t { font: 600 16px/1.3 var(--font-b); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.card-t .linkish:hover { color: var(--cobalt); }
.price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: auto; padding-top: 6px; }
.price strong { font: 800 24px/1 var(--font-d); letter-spacing: -.03em; }
.price s { color: var(--ink-3); font-size: 14px; }
.card .btn { width: 100%; margin-top: 8px; }

/* Listado */
.crumb { margin-top: 24px; font-size: 14px; color: var(--ink-2); }
.crumb a { text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.list-h { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.list-h h1 { font: 800 clamp(28px, 4vw, 40px)/1.05 var(--font-d); letter-spacing: -.035em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14.5px; }
.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin: 18px 0; padding: 12px 16px; background: var(--surface); border-radius: var(--r-m); }
.toolbar label { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; }
.toolbar select { height: 38px; border: 1.5px solid var(--line); border-radius: var(--r-s); padding: 0 10px; background: #fff; }
.toolbar .count { margin-right: auto; color: var(--ink-2); font-size: 14.5px; }
.toolbar input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--cobalt); }

.empty { background: var(--surface); border-radius: var(--r-m); padding: 48px 24px; text-align: center; }
.empty h3 { font: 700 20px var(--font-d); }
.empty p { margin: 6px auto 18px; color: var(--ink-2); max-width: 42ch; }
.skel { height: 330px; border-radius: var(--r-m); background: linear-gradient(100deg, #e9edf3 30%, #f6f8fb 50%, #e9edf3 70%) 0 0 / 300% 100%; animation: sh 1.4s infinite linear; }
@keyframes sh { to { background-position: -150% 0; } }

/* Footer */
.foot { margin-top: 64px; background: var(--ink); color: #c9d3e2; }
.foot-in { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; padding: 40px 0; }
.foot .logo { color: #fff; }
.foot .logo-mark { background: #fff; }
.foot h4 { margin: 0 0 10px; color: #fff; font: 700 16px var(--font-d); }
.foot ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.foot a { text-decoration: none; }
.foot a:hover { text-decoration: underline; }
.foot p { font-size: 14.5px; margin-top: 12px; max-width: 36ch; white-space: pre-line; }
.foot-b { border-top: 1px solid rgba(255, 255, 255, .12); padding: 14px 0; font-size: 13.5px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.foot-b a { color: #9fb0c8; }

/* Diálogos */
dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); border-radius: var(--r-l); max-width: 100vw; max-height: 100dvh; box-shadow: 0 24px 64px -16px rgba(14, 26, 43, .45); }
dialog::backdrop { background: rgba(14, 26, 43, .55); backdrop-filter: blur(2px); }
.dlg-x { position: absolute; right: 12px; top: 12px; z-index: 3; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .92); box-shadow: var(--shadow); font-size: 22px; line-height: 1; }
.dlg-x:hover { background: #fff; }
#dlgProduct { width: min(920px, calc(100vw - 24px)); overflow: auto; }
.pd { display: grid; grid-template-columns: 1fr 1fr; }
.pd-img { background: var(--tint); display: grid; place-items: center; padding: 36px; min-height: 340px; position: relative; }
.pd-img img { width: 100%; max-height: 420px; object-fit: contain; }
.pd-b { padding: 36px 32px 32px; display: flex; flex-direction: column; gap: 10px; }
.pd-b h2 { font: 800 28px/1.1 var(--font-d); letter-spacing: -.03em; padding-right: 30px; }
.pd-price { display: flex; align-items: baseline; gap: 12px; margin: 6px 0; }
.pd-price strong { font: 800 36px/1 var(--font-d); letter-spacing: -.035em; }
.pd-price s { color: var(--ink-3); }
.stock { font-size: 14px; font-weight: 700; color: var(--green); }
.stock.low { color: #B45309; }
.stock.none { color: var(--coral); }
.specs { margin: 6px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.specs li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.buy { display: flex; gap: 12px; margin-top: 10px; }
.buy .btn { flex: 1; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; height: 44px; background: #fff; }
.qty button { width: 40px; height: 100%; border: 0; background: none; font-size: 20px; border-radius: 999px; }
.qty button:hover { background: var(--paper); }
.qty output { min-width: 28px; text-align: center; font-weight: 700; }
.qty.sm { height: 34px; }
.qty.sm button { width: 32px; font-size: 18px; }

/* Carrito */
dialog.drawer { margin: 0 0 0 auto; width: min(440px, 100vw); height: 100dvh; max-height: 100dvh; border-radius: var(--r-l) 0 0 var(--r-l); display: none; flex-direction: column; }
dialog.drawer[open] { display: flex; animation: slideIn .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }
.dr-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.dr-h h2 { font: 800 22px var(--font-d); letter-spacing: -.02em; }
.dr-h .x { position: static; box-shadow: none; background: var(--paper); }
.dr-body { flex: 1; overflow: auto; padding: 8px 20px; }
.dr-f { border-top: 1px solid var(--line); padding: 16px 20px 20px; display: grid; gap: 12px; background: var(--surface); }
.line { display: grid; grid-template-columns: 68px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.line img { width: 68px; height: 68px; border-radius: 10px; background: var(--tint, var(--paper)); object-fit: contain; padding: 6px; }
.line-t { font-weight: 600; line-height: 1.3; font-size: 15px; }
.line-u { font-size: 13.5px; color: var(--ink-2); }
.line-r { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }
.line-sub { font: 800 17px var(--font-d); }
.rm { background: none; border: 0; color: var(--ink-3); font-size: 13px; text-decoration: underline; padding: 4px; }
.rm:hover { color: var(--coral); }
.total { display: flex; justify-content: space-between; align-items: baseline; }
.total strong { font: 800 28px var(--font-d); letter-spacing: -.03em; }
.note { font-size: 13px; color: var(--ink-2); }

/* Formularios */
.field { display: grid; gap: 6px; margin-bottom: 14px; align-content: start; }
.field > span, .field > label { font-weight: 600; font-size: 14px; }
.field small { color: var(--ink-3); font-size: 12.5px; }
.in { width: 100%; min-height: 44px; border: 1.5px solid var(--line); border-radius: var(--r-s); padding: 9px 12px; background: #fff; }
textarea.in { min-height: 90px; resize: vertical; }
.in:focus { outline: none; border-color: var(--cobalt); box-shadow: 0 0 0 4px rgba(35, 71, 245, .12); }
.radios { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.radios label { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: var(--r-s); padding: 11px 12px; font-weight: 600; font-size: 14.5px; cursor: pointer; }
.radios label:has(input:checked) { border-color: var(--cobalt); background: #f3f6ff; }
.radios input { accent-color: var(--cobalt); }
.err { color: var(--coral); font-weight: 600; font-size: 14px; margin: 4px 0 10px; }
.done { text-align: center; padding: 40px 12px; }
.done .ok { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: #E3F6EC; color: var(--green); display: grid; place-items: center; font-size: 32px; }
.done h3 { font: 800 24px var(--font-d); letter-spacing: -.02em; }
.done p { margin: 8px auto 22px; color: var(--ink-2); max-width: 32ch; }
.code { display: inline-block; font: 700 18px/1 ui-monospace, monospace; background: var(--paper); padding: 8px 14px; border-radius: 8px; margin-top: 10px; }

/* Toasts */
#toasts { position: fixed; inset: auto auto 20px 50%; translate: -50% 0; z-index: 100; display: grid; gap: 8px; width: min(420px, calc(100vw - 24px)); margin: 0; padding: 0; border: 0; background: none; overflow: visible; pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; gap: 12px; animation: tin .25s; }
.toast button { background: none; border: 0; color: var(--tag); font-weight: 700; text-decoration: underline; }
.toast.bad { background: var(--coral); }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } }

/* Admin */
body.is-admin .top, body.is-admin .catnav, body.is-admin .perks, body.is-admin .foot, body.is-admin .demo-bar { display: none; }
.adm-bar { background: var(--ink); color: #fff; }
.adm-bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; flex-wrap: wrap; padding: 8px 0; }
.adm-bar .logo { color: #fff; font-size: 20px; }
.adm-bar .logo-mark { background: #fff; width: 26px; height: 26px; }
.adm-bar .logo-mark::after { width: 9px; height: 9px; }
.adm-bar nav { display: flex; gap: 10px; align-items: center; }
.adm-bar .btn { background: rgba(255, 255, 255, .12); color: #fff; min-height: 38px; }
.adm-bar .btn:hover { background: rgba(255, 255, 255, .22); }
.login { max-width: 400px; margin: 64px auto; background: var(--surface); border-radius: var(--r-l); padding: 32px; box-shadow: var(--shadow); }
.login h1 { font: 800 28px var(--font-d); letter-spacing: -.03em; margin-bottom: 4px; }
.login .btn { width: 100%; margin-top: 6px; }
.tabs { display: flex; gap: 6px; margin: 24px 0 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 12px 16px; font-weight: 700; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cobalt); }
.tabs .badge { background: var(--coral); color: #fff; border-radius: 99px; font-size: 12px; padding: 1px 7px; margin-left: 6px; }
.a-tools { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.a-tools .in { width: auto; flex: 1 1 200px; max-width: 360px; }
.a-tools select.in { flex: 0 0 auto; }
.a-tools .sp { flex: 1; }
.rows { background: var(--surface); border-radius: var(--r-m); box-shadow: var(--shadow); overflow: hidden; }
.arow { display: grid; grid-template-columns: 56px minmax(0, 2.2fr) 110px 110px 90px 70px 196px; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.arow:last-child { border-bottom: 0; }
.arow.head { font-size: 13px; font-weight: 700; color: var(--ink-2); background: var(--paper); padding-block: 8px; }
.arow img { width: 56px; height: 56px; border-radius: 10px; object-fit: contain; background: var(--tint, var(--paper)); padding: 4px; }
.arow .nm { font-weight: 600; line-height: 1.25; }
.arow .nm small { display: block; color: var(--ink-3); font-weight: 500; }
.arow .in { min-height: 38px; padding: 4px 8px; }
.arow.off { opacity: .55; }
.nums, .cell { display: contents; }
.lab { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.acts { display: flex; gap: 6px; justify-content: flex-end; }
.sw { position: relative; width: 44px; height: 26px; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 99px; background: #c8d0dc; transition: background .15s; }
.sw i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: translate .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.sw input:checked + i { background: var(--green); }
.sw input:checked + i::after { translate: 18px 0; }
.sw input:focus-visible + i { outline: 3px solid var(--cobalt); outline-offset: 2px; }
.brow { grid-template-columns: 140px minmax(0, 1fr) 70px auto; }
.brow .sw-prev { height: 56px; border-radius: 10px; display: flex; align-items: center; padding: 0 12px; font: 700 14px var(--font-d); }
.orow { grid-template-columns: 128px minmax(0, 1.5fr) 170px 150px auto; }
.orow b { white-space: nowrap; }
.chipst { display: inline-block; white-space: nowrap; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; font-weight: 700; background: #E7ECFF; color: var(--cobalt-d); }
.chipst.ok { background: #E3F6EC; color: var(--green); }
.chipst.bad { background: #FDE8E8; color: var(--coral); }
.chipst.mid { background: #FFF3D1; color: #8a5a00; }
.panel { background: var(--surface); border-radius: var(--r-m); padding: 24px; box-shadow: var(--shadow); max-width: 640px; margin-bottom: 18px; }
.panel h3 { font: 800 20px var(--font-d); margin-bottom: 14px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.form-grid .full { grid-column: 1 / -1; }
.chk { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 14px; }
.chk input { width: 20px; height: 20px; accent-color: var(--cobalt); }
#dlgForm { width: min(680px, calc(100vw - 24px)); overflow: auto; }
.dlg-in { padding: 28px; }
.dlg-in h2 { font: 800 24px var(--font-d); letter-spacing: -.02em; margin-bottom: 18px; padding-right: 36px; }
.dlg-f { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.imgf { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: start; margin-bottom: 14px; }
.imgf .pv { width: 96px; height: 96px; border-radius: 12px; background: var(--paper); object-fit: contain; padding: 6px; border: 1px solid var(--line); }
.imgf .col { display: grid; gap: 8px; }
.imgf .btns { display: flex; gap: 8px; flex-wrap: wrap; }
#dlgConfirm { width: min(400px, calc(100vw - 24px)); }
.ord-items { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14.5px; }
.ord-items td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
.ord-items td:last-child { text-align: right; font-weight: 700; }

/* Responsive */
@media (max-width: 960px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .slide { grid-template-columns: 1fr; padding: 32px 28px 56px; min-height: 0; }
  .slide-art { width: 180px; position: absolute; right: 12px; bottom: 36px; opacity: .95; }
  .slide h2 { max-width: 12ch; }
  .slide p { max-width: 24ch; font-size: 16px; }
  .dots { left: 28px; }
  .foot-in { grid-template-columns: 1fr 1fr; }
  .perks .wrap { gap: 18px; }
}
@media (max-width: 760px) {
  .perks { display: none; }
  .top-in { grid-template-columns: 1fr auto; gap: 10px 12px; padding-block: 10px; min-height: 0; }
  .search { grid-column: 1 / -1; grid-row: 2; max-width: none; }
  .cart-btn .t { display: none; }
  .pd { grid-template-columns: 1fr; }
  .pd-img { min-height: 240px; padding: 24px; }
  .pd-b { padding: 24px 20px; }
  dialog.drawer { border-radius: 0; }
  .arow.head { display: none; }
  .prow { grid-template-columns: 56px 1fr; align-items: start; row-gap: 10px; }

  .prow .cell { display: grid; gap: 2px; min-width: 0; }
  .prow .lab { position: static; width: auto; height: auto; clip: auto; overflow: visible; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .prow .acts { grid-column: 1 / -1; justify-content: flex-start; }
  .brow, .orow { grid-template-columns: 1fr auto; }
  .brow > *, .orow > * { grid-column: auto; }
  .form-grid { grid-template-columns: 1fr; }
  .foot-in { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .tiles { gap: 10px; }

}

}

      k += `<rect x="${33 + i * 11.2}" y="${76 + r * 15}" width="9" height="11" rx="2" fill="${r === 0 && i > 8 ? c : _L}"/>`;

  phone: c => `<rect x="62" y="16" width="76" height="160" rx="16" fill="${_D}"/><rect x="68" y="22" width="64" height="148" rx="11" fill="${c}"/><path d="M68 120l24-26 20 14 20-18v70a11 11 0 0 1-11 11H79a11 11 0 0 1-11-11z" fill="#fff" opacity=".22"/><rect x="88" y="26" width="24" height="6" rx="3" fill="${_D}"/>`,
  charger: c => `<rect x="66" y="52" width="68" height="76" rx="12" fill="${c}"/><rect x="82" y="30" width="8" height="22" fill="${_L}"/><rect x="110" y="30" width="8" height="22" fill="${_L}"/><rect x="92" y="128" width="16" height="10" fill="${_D2}"/><path d="M100 138v16q0 18 24 18h20" fill="none" stroke="${_D}" stroke-width="6" stroke-linecap="round"/><path d="M104 68l-14 22h10l-4 20 16-24h-10z" fill="#fff" opacity=".9"/>`,

  fridge: c => `<rect x="52" y="14" width="96" height="170" rx="10" fill="${_S}" stroke="${_L}" stroke-width="2"/><path d="M52 68h96" stroke="${_L}" stroke-width="3"/><rect x="62" y="30" width="6" height="26" rx="3" fill="${_D2}"/><rect x="62" y="84" width="6" height="40" rx="3" fill="${_D2}"/><rect x="108" y="26" width="30" height="8" rx="4" fill="${c}"/>`,

  cpu: c => {
    let p = '';

};

const _artCache = new Map();
function artUri(key, accent) {
  const k = key + '|' + accent;
  if (_artCache.has(k)) return _artCache.get(k);
  const body = (ART[key] || ART.laptop)(accent);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><ellipse cx="100" cy="184" rx="58" ry="6" fill="#0E1A2B" opacity=".09"/>${body}</svg>`;
  const uri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  _artCache.set(k, uri);
  return uri;
}

/* Imagen de un producto: foto propia (URL o subida) o ilustración según categoría */
function imgOf(p) {
  if (p.image) return p.image;
  const c = CATS[p.category] || CATS.perifericos;
  return artUri(p.art || c.art, c.acc);
}

/* ───────── Capa de datos: Firebase (real) o modo demo (localStorage) ─────────
   Si firebase-config.js tiene tus credenciales, usa Firestore + Auth en tiempo real.
   Si no, funciona en modo demo con datos guardados solo en este navegador. */

const FB_CFG = window.FIREBASE_CONFIG || {};
const HAS_FB = !!(FB_CFG.apiKey && FB_CFG.projectId && !/^TU_/i.test(FB_CFG.apiKey));
const ADMIN_DOMAIN = '@tienda-admin.local';
const userToEmail = u => { u = String(u || '').trim().toLowerCase(); return u.includes('@') ? u : u + ADMIN_DOMAIN; };

/* Almacenamiento tolerante a fallos (modo privado, iframes, cuota llena) */
const _mem = {};
function lsGet(k) {
  if (k in _mem) return _mem[k];
  try { const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch { return null; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); delete _mem[k]; } catch { _mem[k] = v; }
}

const newCode = () => 'P-' + Date.now().toString(36).toUpperCase().slice(-4) + Math.random().toString(36).toUpperCase().slice(2, 5);

/* ── Modo demo ── */
function createDemoDB() {
  const subs = { products: new Set(), banners: new Set(), settings: new Set(), orders: new Set() };
  const key = c => 'nodo_demo_' + c;
  const read = c => lsGet(key(c)) || [];
  const emit = c => subs[c].forEach(cb => cb(read(c)));

  if (!lsGet('nodo_demo_init')) {
    lsSet(key('products'), seedProducts());
    lsSet(key('banners'), SEED_BANNERS);
    lsSet(key('settings'), [{ id: 'store', ...DEFAULT_SETTINGS }]);
    lsSet(key('orders'), []);
    lsSet('nodo_demo_init', 1);
  }
  let admin = !!lsGet('nodo_demo_admin');
  const authSubs = new Set();
  const notifyAuth = () => authSubs.forEach(cb => cb(admin ? { email: 'user' + ADMIN_DOMAIN } : null));

  return {
    mode: 'demo',
    subscribe(col, cb) {
      subs[col].add(cb);
      setTimeout(() => cb(read(col)), 0);
      return () => subs[col].delete(cb);
    },
    async save(col, id, data) {
      const list = read(col);
      const i = id ? list.findIndex(x => x.id === id) : -1;
      if (i >= 0) list[i] = { ...list[i], ...data };
      else { id = id || 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); list.push({ id, ...data }); }
      lsSet(key(col), list); emit(col);
      return id;
    },
    async remove(col, id) {
      lsSet(key(col), read(col).filter(x => x.id !== id)); emit(col);
    },
    async createOrder(order) {
      const code = newCode();
      const list = read('orders');
      list.unshift({ id: 'o' + Date.now().toString(36), code, status: 'nuevo', createdAt: Date.now(), ...order });
      lsSet(key('orders'), list); emit('orders');
      return code;
    },
    auth: {
      onChange(cb) { authSubs.add(cb); setTimeout(() => cb(admin ? { email: 'user' + ADMIN_DOMAIN } : null), 0); },
      async login(u, p) {
        if (String(u).trim().toLowerCase() === 'user' && p === '123456') { admin = true; lsSet('nodo_demo_admin', 1); notifyAuth(); return; }
        throw new Error('Usuario o contraseña incorrectos.');
      },
      async logout() { admin = false; lsSet('nodo_demo_admin', 0); notifyAuth(); },
      async changePassword() { throw new Error('En modo demo no se puede cambiar la contraseña. Conectá Firebase para usar esta opción.'); }
    }
  };
}

/* ── Firebase ── */
async function createFirebaseDB() {
  const V = '10.12.2';
  const base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [appM, fsM, authM] = await Promise.all([
    import(base + 'firebase-app.js'),
    import(base + 'firebase-firestore.js'),
    import(base + 'firebase-auth.js')
  ]);
  const app = appM.initializeApp(FB_CFG);
  const fs = fsM.getFirestore(app);
  const au = authM.getAuth(app);

  const norm = d => {
    const o = { id: d.id, ...d.data() };
    for (const k of ['createdAt', 'updatedAt']) if (o[k] && typeof o[k].toMillis === 'function') o[k] = o[k].toMillis();
    return o;
  };
  const authMsg = e => {
    const c = e && e.code || '';
    if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'Usuario o contraseña incorrectos.';
    if (/too-many-requests/.test(c)) return 'Demasiados intentos. Esperá unos minutos y probá de nuevo.';
    if (/network/.test(c)) return 'No hay conexión. Revisá tu internet.';
    if (/requires-recent-login/.test(c)) return 'Por seguridad, salí y volvé a ingresar antes de cambiar la contraseña.';
    if (/weak-password/.test(c)) return 'La contraseña es muy corta (mínimo 6 caracteres).';
    return 'No se pudo completar la acción (' + (c || 'error') + ').';
  };

  return {
    mode: 'firebase',
    subscribe(col, cb, onErr) {
      const ref = fsM.collection(fs, col);
      const q = col === 'orders' ? fsM.query(ref, fsM.orderBy('createdAt', 'desc')) : ref;
      return fsM.onSnapshot(q, snap => cb(snap.docs.map(norm)), err => { console.error(col, err); onErr && onErr(err); });
    },
    async save(col, id, data) {
      if (id) { await fsM.setDoc(fsM.doc(fs, col, id), data, { merge: true }); return id; }
      const r = await fsM.addDoc(fsM.collection(fs, col), data);
      return r.id;
    },
    async remove(col, id) { await fsM.deleteDoc(fsM.doc(fs, col, id)); },
    async createOrder(order) {
      const code = newCode();
      await fsM.addDoc(fsM.collection(fs, 'orders'), { ...order, code, status: 'nuevo', createdAt: fsM.serverTimestamp() });
      return code;
    },
    auth: {
      onChange(cb) { authM.onAuthStateChanged(au, cb); },
      async login(u, p) {
        try { await authM.signInWithEmailAndPassword(au, userToEmail(u), p); } catch (e) { throw new Error(authMsg(e)); }
      },
      async logout() { await authM.signOut(au); },
      async changePassword(p) {
        try { await authM.updatePassword(au.currentUser, p); } catch (e) { throw new Error(authMsg(e)); }
      }
    }
  };
}

async function openDB() {
  if (!HAS_FB) return createDemoDB();
  return createFirebaseDB(); // si falla, app.js muestra un error (no se cae a datos de ejemplo en producción)
}

const digits = s => String(s || '').replace(/\D/g, '');

/* ───────── Carrito ───────── */
function cartLines() {
  const out = [];
  for (const [id, q] of Object.entries(state.cart)) {
    const p = activeProducts().find(x => x.id === id);
    if (!p) continue;
    const qty = Math.min(Number(q) || 0, stockOf(p));
    if (qty > 0) out.push({ p, qty, sub: p.price * qty });
  }
  return out;
}
const cartCount = () => cartLines().reduce((a, l) => a + l.qty, 0);
const cartTotal = () => cartLines().reduce((a, l) => a + l.sub, 0);

function setQty(id, qty) {
  const p = activeProducts().find(x => x.id === id);
  if (!p) return;
  qty = Math.max(0, Math.min(qty, stockOf(p)));
  if (qty === 0) delete state.cart[id]; else state.cart[id] = qty;
  saveCart(); renderCartBadge(); if ($('#dlgCart').open) renderCart();
}
function addToCart(id, n = 1) {
  const p = activeProducts().find(x => x.id === id);
  if (!p) return;
  const have = state.cart[id] || 0;
  if (stockOf(p) <= 0) return toast('Este producto no tiene stock.', { bad: true });
  if (have + n > stockOf(p)) { setQty(id, stockOf(p)); return toast(`Solo quedan ${stockOf(p)} unidades de este producto.`, { bad: true }); }
  setQty(id, have + n);
  const b = $('#cartBtn'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  toast('Agregado al carrito', { label: 'Ver carrito', fn: openCart });
}
function renderCartBadge() {
  $('#cartN').textContent = cartCount();
  $('#cartT').textContent = money(cartTotal());
}

/* ───────── Toasts y confirmación ───────── */
function toast(msg, opt = {}) {
  const el = document.createElement('div');
  el.className = 'toast' + (opt.bad ? ' bad' : '');
  el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>` + (opt.label ? `<button type="button">${esc(opt.label)}</button>` : '');
  if (opt.label) el.querySelector('button').onclick = () => { opt.fn(); el.remove(); };
  const box = $('#toasts');
  box.replaceChildren(el); // un solo aviso a la vez
  try { box.hidePopover(); box.showPopover(); } catch { /* sin popover: queda sobre la página */ }
  setTimeout(() => el.remove(), opt.label ? 4500 : 3500);
}
function askConfirm(msg, okLabel = 'Eliminar') {
  return new Promise(res => {
    const d = $('#dlgConfirm');
    $('#confirmMsg', d).textContent = msg;
    $('#confirmOk', d).textContent = okLabel;
    const done = v => { d.close(); res(v); };
    $('#confirmOk', d).onclick = () => done(true);
    $('#confirmNo', d).onclick = () => done(false);
    d.oncancel = () => res(false);
    d.showModal();
  });
}

function parseHash() {
  const [a, b] = location.hash.replace(/^#\/?/, '').split('/');
  if (a === 'admin') return { name: 'admin' };
  if (a === 'c' && CATS[b]) return { name: 'cat', cat: b };
  if (a === 'ofertas') return { name: 'offers' };
  return { name: 'home' };
}
window.addEventListener('hashchange', () => {
  state.route = parseHash(); state.sub = ''; state.q = ''; state.sort = 'rel'; state.onlyOffers = false; state.inStock = false;
  $('#q').value = '';
  render(); window.scrollTo(0, 0);
});

    </button>
    <div class="card-b">
      <p class="card-meta">${esc(p.brand || c.name)}</p>
      <h3 class="card-t"><button type="button" class="linkish" data-act="open" data-id="${esc(p.id)}">${esc(p.name)}</button></h3>
      <div class="price">${offer ? `<s>${money(p.oldPrice)}</s>` : ''}<strong>${money(p.price)}</strong></div>

function sortList(list) {
  const s = state.sort, byNew = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
  const l = [...list];
  if (s === 'asc') l.sort((a, b) => a.price - b.price);
  else if (s === 'desc') l.sort((a, b) => b.price - a.price);
  else if (s === 'disc') l.sort((a, b) => (onOffer(b) ? pct(b) : 0) - (onOffer(a) ? pct(a) : 0));
  else if (s === 'az') l.sort((a, b) => a.name.localeCompare(b.name, 'es'));
  else l.sort(byNew);
  return l;
}

function heroHTML() {
  const bs = state.banners.filter(b => b.active !== false).sort((a, b) => (a.order || 0) - (b.order || 0));
  if (!bs.length) return '';
  if (state.hero >= bs.length) state.hero = 0;
  const slides = bs.map((b, i) => {
    const bg = b.color || '#0E1A2B', dark = lum(bg) > .6, fg = dark ? '#0E1A2B' : '#fff';
    const art = b.image ? `<img class="photo" src="${esc(b.image)}" alt="">` : `<img src="${esc(artUri(b.art || 'laptop', dark ? '#0E1A2B' : '#FFD21F'))}" alt="">`;
    const href = b.link === 'ofertas' ? '#/ofertas' : (CATS[b.link] ? '#/c/' + b.link : '#/');
    return `<div class="slide ${i === state.hero ? 'on' : ''}" style="--bg:${esc(bg)};--fg:${fg}" role="group" aria-label="Oferta ${i + 1} de ${bs.length}">
      <div><h2>${esc(b.title)}</h2>${b.subtitle ? `<p>${esc(b.subtitle)}</p>` : ''}${b.cta ? `<a class="btn ${dark ? 'btn-ink' : 'btn-tag'}" href="${href}">${esc(b.cta)}</a>` : ''}</div>
      <div class="slide-art">${art}</div></div>`;
  }).join('');
  const cur = bs[state.hero], darkDots = lum(cur.color || '#0E1A2B') > .6;
  const dots = bs.length > 1 ? `<div class="dots ${darkDots ? 'dark' : ''}">${bs.map((_, i) => `<button type="button" data-act="hero" data-i="${i}" aria-label="Ir a la oferta ${i + 1}" aria-current="${i === state.hero}"></button>`).join('')}</div>` : '';
  return `<section class="hero wrap" aria-roledescription="carrusel" aria-label="Ofertas destacadas">${slides}${dots}</section>`;
}
function setHero(i) {
  const bs = state.banners.filter(b => b.active !== false);
  if (!bs.length) return;
  state.hero = (i + bs.length) % bs.length;
  $$('.slide').forEach((s, k) => s.classList.toggle('on', k === state.hero));
  const cur = [...bs].sort((a, b) => (a.order || 0) - (b.order || 0))[state.hero];
  const dots = $('.dots');
  if (dots) {
    dots.classList.toggle('dark', lum(cur.color || '#0E1A2B') > .6);
    $$('button', dots).forEach((b, k) => b.setAttribute('aria-current', k === state.hero));
  }
}
setInterval(() => {
  if (state.route.name !== 'home' || state.q || document.hidden || $('.hero:hover, .hero:focus-within')) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setHero(state.hero + 1);
}, 6500);

function storeHome() {
  const ps = activeProducts();
  if (state.error) return errorBox();
  if (!state.loaded.products) return heroHTML() + `<section class="sec wrap">${skeletons(8)}</section>`;
  const offers = sortList(ps.filter(onOffer)).slice(0, 8);
  const tiles = Object.entries(CATS).map(([k, c]) => {
    const n = ps.filter(p => p.category === k).length;
    return `<a class="tile" href="#/c/${k}" style="--tint:${c.tint}"><h3>${c.name}</h3><p>${esc(c.blurb)}</p><img src="${esc(artUri(c.art, c.acc))}" alt=""><span class="sr">${n} productos</span></a>`;
  }).join('');
  let html = heroHTML() + `<section class="sec wrap"><div class="sec-h"><h2>Comprá por sección</h2></div><div class="tiles">${tiles}</div></section>`;
  if (offers.length) html += `<section class="sec wrap"><div class="sec-h"><h2>Ofertas</h2><a href="#/ofertas">Ver todas</a></div><div class="grid">${offers.map(card).join('')}</div></section>`;
  for (const [k, c] of Object.entries(CATS)) {
    const l = sortList(ps.filter(p => p.category === k)).slice(0, 4);
    if (l.length) html += `<section class="sec wrap"><div class="sec-h"><h2>${c.name}</h2><a href="#/c/${k}">Ver todo en ${c.name}</a></div><div class="grid">${l.map(card).join('')}</div></section>`;
  }
  if (!ps.length) html += `<section class="sec wrap"><div class="empty"><h3>Estamos cargando el catálogo</h3><p>Todavía no hay productos publicados. Volvé en unos minutos.</p></div></section>`;
  return html;
}
function errorBox() {
  return `<section class="sec wrap"><div class="empty"><h3>No pudimos cargar la tienda</h3><p>${esc(state.error)}</p><button type="button" class="btn btn-primary" onclick="location.reload()">Reintentar</button></div></section>`;
}

function listing({ title, crumb, list, subs }) {
  if (state.error) return errorBox();
  let l = list;
  if (state.sub) l = l.filter(p => p.sub === state.sub);
  if (state.onlyOffers) l = l.filter(onOffer);
  if (state.inStock) l = l.filter(p => stockOf(p) > 0);
  l = sortList(l);
  const chips = subs && subs.length ? `<div class="chips" role="group" aria-label="Subcategorías"><button type="button" class="chip" data-act="sub" data-v="" aria-pressed="${!state.sub}">Todo</button>${subs.map(s => `<button type="button" class="chip" data-act="sub" data-v="${esc(s)}" aria-pressed="${state.sub === s}">${esc(s)}</button>`).join('')}</div>` : '';
  const tb = `<div class="toolbar"><span class="count" aria-live="polite">${l.length} ${l.length === 1 ? 'producto' : 'productos'}</span>
    <label><input type="checkbox" data-act="onlyOffers" ${state.onlyOffers ? 'checked' : ''}> Solo ofertas</label>
    <label><input type="checkbox" data-act="inStock" ${state.inStock ? 'checked' : ''}> Con stock</label>
    <label>Ordenar <select data-act="sort">${[['rel', 'Más nuevos'], ['asc', 'Menor precio'], ['desc', 'Mayor precio'], ['disc', 'Mayor descuento'], ['az', 'A a Z']].map(([v, t]) => `<option value="${v}" ${state.sort === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>`;
  const body = !state.loaded.products ? skeletons(8)
    : l.length ? `<div class="grid">${l.map(card).join('')}</div>`
    : `<div class="empty"><h3>No encontramos productos</h3><p>Probá con otros filtros o buscá por otro nombre.</p><button type="button" class="btn btn-primary" data-act="clear">Quitar filtros</button></div>`;
  return `<div class="wrap"><p class="crumb"><a href="#/">Inicio</a>${crumb ? ' / ' + crumb : ''}</p>
    <div class="list-h"><h1>${title}</h1></div>${chips}${tb}${body}</div>`;
}

function storeView() {
  const ps = activeProducts();
  if (state.q) {
    const q = state.q.toLowerCase();
    const list = ps.filter(p => [p.name, p.brand, p.sub, catOf(p).name, p.description].join(' ').toLowerCase().includes(q));
    return listing({ title: `Resultados para “${esc(state.q)}”`, crumb: 'Búsqueda', list });
  }
  const r = state.route;
  if (r.name === 'cat') {
    const list = ps.filter(p => p.category === r.cat);
    const subs = [...new Set(list.map(p => p.sub).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
    return listing({ title: CATS[r.cat].name, crumb: CATS[r.cat].name, list, subs });
  }
  if (r.name === 'offers') return listing({ title: 'Ofertas', crumb: 'Ofertas', list: ps.filter(onOffer) });
  return storeHome();
}

function renderChrome() {
  const s = state.settings;
  document.title = `${s.storeName} · ${s.tagline || 'Tecnología y electrodomésticos'}`;
  $$('.js-name').forEach(e => e.textContent = s.storeName);
  const perks = (s.perks || []).filter(Boolean);
  $('#perks').hidden = !perks.length;
  $('#perks .wrap').innerHTML = perks.map(p => `<span>${esc(p)}</span>`).join('');
  const r = state.route, cur = state.q ? '' : (r.name === 'cat' ? r.cat : r.name === 'offers' ? 'ofertas' : 'home');
  $('#catNav ul').innerHTML =
    `<li><a href="#/" ${cur === 'home' ? 'aria-current="page"' : ''}>Inicio</a></li>` +
    Object.entries(CATS).map(([k, c]) => `<li><a href="#/c/${k}" ${cur === k ? 'aria-current="page"' : ''}>${c.name}</a></li>`).join('') +
    `<li><a class="hot" href="#/ofertas" ${cur === 'ofertas' ? 'aria-current="page"' : ''}>Ofertas</a></li>`;
  $('#footInfo').textContent = s.footerInfo || '';
  $('#footLocal').hidden = !s.footerInfo;
  $('#footTag').textContent = s.tagline || '';
  $('#footCats').innerHTML = Object.entries(CATS).map(([k, c]) => `<li><a href="#/c/${k}">${c.name}</a></li>`).join('') + '<li><a href="#/ofertas">Ofertas</a></li>';
  $('#demoBar').hidden = DB?.mode !== 'demo';
  renderCartBadge();
}

function render() {
  const admin = state.route.name === 'admin';
  document.body.classList.toggle('is-admin', admin);
  renderChrome();
  app.innerHTML = admin ? adminView() : storeView();
  if (admin) renderAdminBody();
}

/* ───────── Producto ───────── */
let pdQty = 1;
function openProduct(id) {
  const p = activeProducts().find(x => x.id === id);
  if (!p) return;
  pdQty = 1;
  const c = catOf(p), st = stockOf(p), offer = onOffer(p);
  const stock = st <= 0 ? '<p class="stock none">Sin stock</p>' : st <= 5 ? `<p class="stock low">Quedan ${st} unidades</p>` : '<p class="stock">Disponible</p>';
  const specs = String(p.specs || '').split('\n').map(s => s.trim()).filter(Boolean);
  $('#dlgProduct').innerHTML = `<button type="button" class="dlg-x" data-act="closeDlg" aria-label="Cerrar">×</button>
    <div class="pd"><div class="pd-img" style="--tint:${c.tint}"><img src="${esc(imgOf(p))}" alt="${esc(p.name)}">${offer ? `<span class="tag">-${pct(p)}%</span>` : ''}</div>
    <div class="pd-b"><p class="card-meta">${esc([p.brand, p.sub].filter(Boolean).join(' · ') || c.name)}</p><h2>${esc(p.name)}</h2>
      <div class="pd-price"><strong>${money(p.price)}</strong>${offer ? `<s>${money(p.oldPrice)}</s>` : ''}</div>${stock}
      ${p.description ? `<p class="muted">${esc(p.description)}</p>` : ''}
      ${specs.length ? `<ul class="specs">${specs.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      <div class="buy"><div class="qty" role="group" aria-label="Cantidad"><button type="button" data-act="pdMinus" aria-label="Menos">−</button><output id="pdQ" aria-live="polite">1</output><button type="button" data-act="pdPlus" aria-label="Más">+</button></div>
      <button type="button" class="btn btn-primary" data-act="pdAdd" data-id="${esc(p.id)}" ${st <= 0 ? 'disabled' : ''}>Agregar al carrito</button></div></div></div>`;
  $('#dlgProduct').showModal();
  $('#dlgProduct').scrollTop = 0;
}

/* ───────── Carrito (panel lateral) ───────── */
function openCart() { state.cartStep = 'cart'; state.orderErr = ''; renderCart(); const d = $('#dlgCart'); if (!d.open) d.showModal(); }
function renderCart() {
  const d = $('#dlgCart'), lines = cartLines(), total = cartTotal();
  const head = (t, back) => `<div class="dr-h">${back ? `<button type="button" class="btn btn-line btn-sm" data-act="cartBack">Volver</button>` : `<h2>${t}</h2>`}<button type="button" class="dlg-x x" data-act="closeDlg" aria-label="Cerrar">×</button></div>`;
  if (state.cartStep === 'done') {
    d.innerHTML = head('Pedido') + `<div class="dr-body"><div class="done"><div class="ok" aria-hidden="true">✓</div><h3>¡Recibimos tu pedido!</h3><p>Te escribimos por WhatsApp para coordinar el pago y la entrega.</p><span class="code">${esc(state.doneCode)}</span></div></div><div class="dr-f"><button type="button" class="btn btn-primary" data-act="closeDlg">Seguir mirando productos</button></div>`;
    return;
  }
  if (!lines.length) {
    d.innerHTML = head(`Tu carrito`) + `<div class="dr-body"><div class="empty" style="margin-top:16px"><h3>Tu carrito está vacío</h3><p>Agregá productos y los vas a ver acá con el total.</p><button type="button" class="btn btn-primary" data-act="closeDlg">Ver productos</button></div></div>`;
    return;
  }
  if (state.cartStep === 'checkout') {
    const v = state.form || {};
    d.innerHTML = head('', true) + `<form id="checkoutForm" class="dr-body" style="padding-top:18px" novalidate>
      <h2 style="font:800 22px var(--font-d);margin-bottom:14px">Tus datos</h2>
      <div class="field"><label for="f-name">Nombre y apellido</label><input class="in" id="f-name" name="name" autocomplete="name" required value="${esc(v.name)}"></div>
      <div class="field"><label for="f-phone">Teléfono o WhatsApp</label><input class="in" id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required value="${esc(v.phone)}"><small>Te contactamos a este número para confirmar el pedido.</small></div>
      <div class="field"><span>¿Cómo lo recibís?</span><div class="radios"><label><input type="radio" name="delivery" value="retiro" ${v.delivery !== 'envio' ? 'checked' : ''}> Retiro en el local</label><label><input type="radio" name="delivery" value="envio" ${v.delivery === 'envio' ? 'checked' : ''}> Envío a domicilio</label></div></div>
      <div class="field" id="addrField" ${v.delivery === 'envio' ? '' : 'hidden'}><label for="f-addr">Dirección de entrega</label><input class="in" id="f-addr" name="address" autocomplete="street-address" value="${esc(v.address)}"></div>
      <div class="field"><label for="f-note">Comentarios (opcional)</label><textarea class="in" id="f-note" name="note" rows="2">${esc(v.note)}</textarea></div>
      <p class="err" id="orderErr" role="alert" ${state.orderErr ? '' : 'hidden'}>${esc(state.orderErr)}</p>
    </form>
    <div class="dr-f"><div class="total"><span>Total a pagar</span><strong>${money(total)}</strong></div>
    <button type="submit" form="checkoutForm" class="btn btn-primary" ${state.sending ? 'disabled' : ''}>${state.sending ? 'Enviando pedido…' : 'Confirmar pedido'}</button>
    <p class="note">El pago se coordina con el local al confirmar tu pedido.</p></div>`;
    return;
  }
  d.innerHTML = head(`Tu carrito (${cartCount()})`) + `<div class="dr-body">${lines.map(({ p, qty, sub }) => `<div class="line">
      <img src="${esc(imgOf(p))}" alt="" style="--tint:${catOf(p).tint}">
      <div><p class="line-t">${esc(p.name)}</p><p class="line-u">${money(p.price)} c/u</p>
      <div class="line-r"><div class="qty sm" role="group" aria-label="Cantidad de ${esc(p.name)}"><button type="button" data-act="lineMinus" data-id="${esc(p.id)}" aria-label="Menos">−</button><output>${qty}</output><button type="button" data-act="linePlus" data-id="${esc(p.id)}" aria-label="Más">+</button></div><span class="line-sub">${money(sub)}</span></div>
      <button type="button" class="rm" data-act="lineRm" data-id="${esc(p.id)}">Quitar</button></div></div>`).join('')}</div>
    <div class="dr-f"><div class="total"><span>Total</span><strong>${money(total)}</strong></div>
    <button type="button" class="btn btn-primary" data-act="checkout">Finalizar compra</button>
    <button type="button" class="rm" data-act="clearCart">Vaciar carrito</button></div>`;
}

function readCheckout(form) {
  const f = new FormData(form);
  return { name: String(f.get('name') || '').trim(), phone: String(f.get('phone') || '').trim(), delivery: f.get('delivery') === 'envio' ? 'envio' : 'retiro', address: String(f.get('address') || '').trim(), note: String(f.get('note') || '').trim() };
}
function waText(order, code) {
  const l = order.items.map(i => `• ${i.qty} x ${i.name} — ${money(i.price * i.qty)}`).join('\n');
  return `Hola, quiero hacer este pedido (${code}):\n${l}\nTotal: ${money(order.total)}\n\nNombre: ${order.customer.name}\nTeléfono: ${order.customer.phone}\n${order.customer.delivery === 'envio' ? 'Envío a: ' + order.customer.address : 'Retiro en el local'}${order.customer.note ? '\nComentarios: ' + order.customer.note : ''}`;
}
async function submitOrder(form) {
  if (state.sending) return;
  const c = readCheckout(form); state.form = c;
  const fail = m => { state.orderErr = m; renderCart(); $('#orderErr')?.focus?.(); };
  if (!c.name) return fail('Escribí tu nombre.');
  if (digits(c.phone).length < 7) return fail('Escribí un teléfono válido para poder contactarte.');
  if (c.delivery === 'envio' && !c.address) return fail('Escribí la dirección de entrega.');
  const lines = cartLines();
  if (!lines.length) return fail('Tu carrito está vacío.');
  const order = {
    customer: c,
    items: lines.map(({ p, qty }) => ({ id: p.id, name: p.name, price: p.price, qty })),
    itemCount: lines.reduce((a, l) => a + l.qty, 0),
    total: cartTotal()
  };
  let win = null;
  if (state.settings.linkFallback && digits(state.settings.waNumber)) win = window.open('', '_blank');
  state.sending = true; state.orderErr = ''; renderCart();
  try {
    const code = await DB.createOrder(order);
    state.sending = false; state.cart = {}; saveCart(); state.form = null; state.doneCode = code; state.cartStep = 'done';
    renderCartBadge(); renderCart();
    if (win) win.location.href = `https://wa.me/${digits(state.settings.waNumber)}?text=${encodeURIComponent(waText(order, code))}`;
  } catch (e) {
    console.error(e); if (win) win.close();
    state.sending = false;
    fail('No pudimos enviar el pedido. Revisá tu conexión e intentá de nuevo.');
  }
}

/* ───────── Eventos ───────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t) {
    const id = t.dataset.id, a = t.dataset.act;
    if (a === 'open') openProduct(id);
    else if (a === 'add') addToCart(id);
    else if (a === 'hero') setHero(+t.dataset.i);
    else if (a === 'sub') { state.sub = t.dataset.v; render(); }
    else if (a === 'clear') { state.sub = ''; state.onlyOffers = false; state.inStock = false; state.q = ''; $('#q').value = ''; render(); }
    else if (a === 'closeDlg') t.closest('dialog').close();
    else if (a === 'pdMinus') { pdQty = Math.max(1, pdQty - 1); $('#pdQ').textContent = pdQty; }
    else if (a === 'pdPlus') { const p = state.products.find(x => x.id === $('[data-act=pdAdd]').dataset.id); pdQty = Math.min(pdQty + 1, Math.min(stockOf(p), 99)); $('#pdQ').textContent = pdQty; }
    else if (a === 'pdAdd') { addToCart(id, pdQty); $('#dlgProduct').close(); }
    else if (a === 'lineMinus') setQty(id, (state.cart[id] || 0) - 1);
    else if (a === 'linePlus') setQty(id, (state.cart[id] || 0) + 1);
    else if (a === 'lineRm') setQty(id, 0);
    else if (a === 'clearCart') askConfirm('¿Vaciar el carrito?', 'Vaciar').then(ok => { if (ok) { state.cart = {}; saveCart(); renderCartBadge(); renderCart(); } });
    else if (a === 'checkout') { state.cartStep = 'checkout'; renderCart(); }
    else if (a === 'cartBack') { state.cartStep = 'cart'; renderCart(); }
    else if (a.startsWith('adm')) adminClick(a, t, e);
    return;
  }
  if (e.target.tagName === 'DIALOG') e.target.close(); // clic en el fondo
});
$('#cartBtn').addEventListener('click', openCart);
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset?.act;
  if (a === 'sort') { state.sort = t.value; render(); }
  else if (a === 'onlyOffers') { state.onlyOffers = t.checked; render(); }
  else if (a === 'inStock') { state.inStock = t.checked; render(); }
  else if (t.name === 'delivery' && t.closest('#checkoutForm')) { $('#addrField').hidden = t.value !== 'envio'; }
  else if (a?.startsWith('adm')) adminChange(a, t);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'checkoutForm') { e.preventDefault(); submitOrder(f); }
  else if (f.dataset?.form) { e.preventDefault(); adminSubmit(f); }
  else if (f.id === 'loginForm') { e.preventDefault(); doLogin(f); }
  else if (f.id === 'searchForm') e.preventDefault();
});
$('#q').addEventListener('input', e => {
  state.q = e.target.value.trim();
  if (state.route.name === 'admin') { location.hash = '#/'; return; }
  state.sub = ''; render();
});

/* ───────── Arranque ───────── */
function loadPublic() {
  const bad = err => { state.error = 'No se pudo conectar con el catálogo. Revisá tu conexión e intentá de nuevo.'; state.loaded.products = true; render(); };
  DB.subscribe('products', l => { state.products = l; state.loaded.products = true; state.error = ''; softRender(); }, bad);
  DB.subscribe('banners', l => { state.banners = l; state.loaded.banners = true; softRender(); });
  DB.subscribe('settings', l => {
    const s = l.find(x => x.id === 'store');
    state.settings = { ...DEFAULT_SETTINGS, ...(s || {}) };
    if (typeof state.settings.perks === 'string') state.settings.perks = state.settings.perks.split('\n');
    softRender();
  });
}
let adminListeners = false;
function loadOrders() {
  if (state.ordersUnsub) return;
  let first = true;
  state.ordersUnsub = DB.subscribe('orders', l => {
    if (!first && l.length > state.orders.length) toast('Llegó un pedido nuevo', { label: 'Ver', fn: () => { state.admin.tab = 'orders'; location.hash = '#/admin'; render(); } });
    first = false; state.orders = l; softRender();
  });
}
/* Re-render que no interrumpe a quien está escribiendo en el panel */
let pendingRender = false;
function softRender() {
  if (state.route.name === 'admin') {
    renderChrome();
    if (document.activeElement?.closest?.('#adminBody input, #adminBody select')) { pendingRender = true; return; }
    $('#adminShell') && renderAdminBody();
    if (!$('#adminShell')) render();
    renderCartBadge();
    return;
  }
  // En la tienda, no tocar la pantalla si hay un diálogo con foco en un formulario
  render();
  if ($('#dlgCart').open) renderCart();
}
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { if (!document.activeElement?.closest?.('#adminBody input, #adminBody select')) { pendingRender = false; renderAdminBody(); } }, 50); });

(async function init() {
  state.route = parseHash();
  render();
  try { DB = await openDB(); }
  catch (e) {
    console.error(e);
    state.error = 'No se pudo cargar la tienda. Revisá tu conexión e intentá de nuevo.'; state.loaded.products = true; render(); return;
  }
  render();
  loadPublic();
  DB.auth.onChange(u => {
    state.user = u; state.authReady = true;
    if (u) loadOrders(); else { state.ordersUnsub && state.ordersUnsub(); state.ordersUnsub = null; state.orders = []; }
    if (state.route.name === 'admin') render();
  });

async function fileToDataUrl(file, maxSide) {
  const bmp = await createImageBitmap(file);
  let side = maxSide, q = .86;
  for (let i = 0; i < 6; i++) {
    const r = Math.min(1, side / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
    const x = c.getContext('2d'); x.drawImage(bmp, 0, 0, c.width, c.height);
    let url = c.toDataURL('image/webp', q);
    if (!url.startsWith('data:image/webp')) { x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); url = c.toDataURL('image/jpeg', q); }
    if (url.length < 600000) return url;
    side *= .8; q -= .08;
  }
  throw new Error('La imagen es demasiado pesada. Probá con una más chica.');
}

function formErr(form, msg) { const e = $('[data-err]', form); e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: 'nearest' }); }
async function guarded(fn, form) {
  const btn = form && $('button[type=submit]', form); if (btn) btn.disabled = true;
  try { await fn(); }
  catch (e) { console.error(e); const m = /permission|insufficient/i.test(e.message || e.code || '') ? 'Tu sesión no tiene permiso para guardar. Volvé a ingresar.' : (e.message || 'No se pudo guardar.'); form ? formErr(form, m) : toast(m, { bad: true }); }
  finally { if (btn) btn.disabled = false; }
}

function adminClick(a, t) {
  const id = t.dataset.id;
  if (a === 'admTab') { state.admin.tab = t.dataset.tab; renderAdminBody(); }
  else if (a === 'admNew') openProductForm();
  else if (a === 'admEdit') openProductForm(id);
  else if (a === 'admDel') { const p = state.products.find(x => x.id === id); askConfirm(`¿Eliminar “${p?.name}”? No se puede deshacer.`).then(ok => ok && guarded(async () => { await DB.remove('products', id); toast('Producto eliminado'); })); }
  else if (a === 'admBNew') openBannerForm();
  else if (a === 'admBEdit') openBannerForm(id);
  else if (a === 'admBDel') { const b = state.banners.find(x => x.id === id); askConfirm(`¿Eliminar el banner “${b?.title}”?`).then(ok => ok && guarded(async () => { await DB.remove('banners', id); toast('Banner eliminado'); })); }
  else if (a === 'admOrder') openOrder(id);
  else if (a === 'admLogout') DB.auth.logout().then(() => { state.loginErr = ''; render(); });
  else if (a === 'admImgClear') { const f = t.closest('form'); f.image.value = ''; $('#f-img').value = ''; updatePreview(f); }
  else if (a === 'admSeed') askConfirm('Se cargarán los productos y banners de ejemplo. ¿Continuar?', 'Cargar').then(ok => ok && guarded(async () => {
    for (const p of seedProducts()) await DB.save('products', p.id, p);
    for (const b of SEED_BANNERS) await DB.save('banners', b.id, b);
    toast('Productos de ejemplo cargados');
  }));
}

function adminChange(a, t) {
  const id = t.dataset.id;
  if (a === 'admCatFilter') { state.admin.cat = t.value; $('#aList').innerHTML = productRows(); }
  else if (a === 'admInline') {
    const field = t.dataset.field, raw = t.value.trim();
    let v = raw === '' ? (field === 'price' ? NaN : (field === 'stock' ? null : 0)) : num(raw);
    if ((typeof v === 'number' && (Number.isNaN(v) || v < 0))) { toast('Escribí un número válido.', { bad: true }); return renderAdminBody(); }
    if (field === 'stock' && v !== null) v = Math.floor(v);
    guarded(async () => { await DB.save('products', id, { [field]: v, updatedAt: Date.now() }); toast('Guardado'); });
  }
  else if (a === 'admActive') guarded(async () => { await DB.save('products', id, { active: t.checked, updatedAt: Date.now() }); });
  else if (a === 'admStatus') guarded(async () => { await DB.save('orders', id, { status: t.value }); toast('Estado actualizado'); });
  else if (a === 'admPreview') updatePreview(t.closest('form'));
  else if (a === 'admImgFile') {
    const f = t.files[0]; if (!f) return;
    const form = t.closest('form'), isBanner = form.dataset.form === 'banner';
    fileToDataUrl(f, isBanner ? 1100 : 800).then(url => { form.image.value = url; $('#f-img').value = ''; updatePreview(form); })
      .catch(e => formErr(form, e.message || 'No se pudo leer la imagen.'));
  }
}
document.addEventListener('input', e => {
  const t = e.target, a = t.dataset?.act;
  if (a === 'admSearch') { state.admin.q = t.value; $('#aList').innerHTML = productRows(); }
  else if (a === 'admImgUrl') { const f = t.closest('form'); f.image.value = t.value.trim(); updatePreview(f); }
  else if (a === 'admPreview' && t.type === 'color') updatePreview(t.closest('form'));
});

async function adminSubmit(form) {
  const kind = form.dataset.form, id = form.dataset.id || null, f = new FormData(form);
  const s = k => String(f.get(k) ?? '').trim();
  $('[data-err]', form).hidden = true;

  if (kind === 'product') {
    const price = num(f.get('price')), old = String(f.get('oldPrice')).trim() === '' ? 0 : num(f.get('oldPrice'));
    const stockRaw = s('stock'), stock = stockRaw === '' ? null : Math.floor(num(stockRaw));
    if (!s('name')) return formErr(form, 'Escribí el nombre del producto.');
    if (Number.isNaN(price) || price < 0) return formErr(form, 'Escribí un precio válido.');
    if (Number.isNaN(old) || old < 0) return formErr(form, 'El precio anterior no es válido.');
    if (stock !== null && (Number.isNaN(stock) || stock < 0)) return formErr(form, 'El stock no es válido.');
    const data = { name: s('name'), category: s('category'), sub: s('sub'), brand: s('brand'), price, oldPrice: old, stock, description: s('description'), specs: String(f.get('specs') || '').trim(), image: s('image'), art: s('art'), active: f.get('active') === 'on', updatedAt: Date.now() };
    if (!id) data.createdAt = Date.now();
    return guarded(async () => { await DB.save('products', id, data); $('#dlgForm').close(); toast('Producto guardado'); }, form);
  }
  if (kind === 'banner') {
    if (!s('title')) return formErr(form, 'Escribí el título del banner.');
    const data = { title: s('title'), subtitle: s('subtitle'), cta: s('cta'), link: s('link'), color: s('color') || '#2347F5', order: Number.isNaN(num(f.get('order'))) ? 1 : num(f.get('order')), image: s('image'), art: s('art') || 'laptop', active: f.get('active') === 'on', updatedAt: Date.now() };
    return guarded(async () => { await DB.save('banners', id, data); $('#dlgForm').close(); toast('Banner guardado'); }, form);
  }
  if (kind === 'settings') {
    if (!s('storeName')) return formErr(form, 'Escribí el nombre de la tienda.');
    const linkFallback = f.get('linkFallback') === 'on';
    if (linkFallback && digits(s('waNumber')).length < 8) return formErr(form, 'Para activar el respaldo, escribí un número de WhatsApp válido.');
    const data = { storeName: s('storeName'), tagline: s('tagline'), perks: String(f.get('perks') || '').split('\n').map(x => x.trim()).filter(Boolean).slice(0, 3), footerInfo: String(f.get('footerInfo') || '').trim(), linkFallback, waNumber: digits(s('waNumber')) };
    return guarded(async () => { await DB.save('settings', 'store', data); toast('Ajustes guardados'); }, form);
  }
  if (kind === 'password') {
    const p1 = String(f.get('p1') || ''), p2 = String(f.get('p2') || '');
    if (p1.length < 6) return formErr(form, 'La contraseña debe tener al menos 6 caracteres.');
    if (p1 !== p2) return formErr(form, 'Las contraseñas no coinciden.');
    return guarded(async () => { await DB.auth.changePassword(p1); form.reset(); toast('Contraseña actualizada'); }, form);
  }
}

</script>
</body>
